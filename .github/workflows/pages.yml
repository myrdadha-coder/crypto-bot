name: Deploy Mini App to GitHub Pages
on:
  push:
    branches: [creofkfcoabot]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate source and demo database schema
        run: |
          node --check src/index.js
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import vm from 'node:vm';
          const html = readFileSync('index.html', 'utf8');
          const mirror = readFileSync('public/index.html', 'utf8');
          const worker = readFileSync('src/index.js', 'utf8');
          if (html !== mirror) throw new Error('index.html and public/index.html differ');
          const scripts = [...html.matchAll(/<script\\b(?![^>]*\\bsrc=)[^>]*>([\\s\\S]*?)<\\/script>/gi)].map(match => match[1]).filter(source => source.trim());
          if (!scripts.length) throw new Error('No inline JavaScript found');
          new vm.Script(scripts.join('\\n'), { filename: 'combined inline app scripts' });
          if ((html.match(/function selectHistoryFilter\\s*\\(/g) || []).length !== 1) throw new Error('History filter function is duplicated or missing');
          for (const screen of ['wallet', 'history', 'exchange', 'p2p', 'profile']) {
            if (!new RegExp('<section[^>]*id=[\\\\\\'"]' + screen + '[\\\\\\'"]').test(html)) throw new Error('Missing screen: ' + screen);
          }
          if (!html.includes('apiDemo("history")')) throw new Error('History API is not wired');
          if (html.includes('demoBuyQty') || html.includes('submitDemoBuy')) throw new Error('Disabled P2P purchase UI is still present');
          if (html.includes('aria-label="Crypto Pay" onclick="openScreen(\\\\\\'usdt-game\\\\\\')')) throw new Error('Crypto Pay points to the USDT game');
          if (!worker.includes('Pокупка')) { /* no-op: Unicode spelling is not a test condition */ }
          if (!worker.includes('status:501')) throw new Error('P2P purchase endpoint is not safely disabled');
          if (!worker.includes('!currencies.includes(currency)')) throw new Error('Payment currency validation is not using the shared currency list');
          console.log('Passed: Worker syntax, combined inline JS syntax, mirrored HTML, screens, history wiring, unique filter, P2P safety and currency validation.');
          NODE
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect(':memory:')
          db.executescript(open('schema.sql', encoding='utf-8').read())
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected = {'users', 'balances', 'demo_transactions', 'demo_payments'}
          assert expected <= tables, f'Missing tables: {expected - tables}'
          print('Passed: SQLite schema creates all expected tables.')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
