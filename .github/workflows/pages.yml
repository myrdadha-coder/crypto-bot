name: Deploy Mini App to GitHub Pages
on:
  push:
    branches: [creofkfcoabot]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate source, wallet flows and demo database schema
        run: |
          node --check src/index.js
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import vm from 'node:vm';
          const html = readFileSync('index.html', 'utf8');
          const mirror = readFileSync('public/index.html', 'utf8');
          const worker = readFileSync('src/index.js', 'utf8');
          if (html !== mirror) throw new Error('index.html and public/index.html differ');
          const inlineScripts = [];
          for (const tag of html.split('<script').slice(1)) {
            const openEnd = tag.indexOf('>');
            const closeStart = tag.indexOf('</script>');
            if (openEnd < 0 || closeStart < 0 || tag.slice(0, openEnd).includes('src=')) continue;
            const source = tag.slice(openEnd + 1, closeStart);
            if (source.trim()) inlineScripts.push(source);
          }
          if (!inlineScripts.length) throw new Error('No inline JavaScript found');
          new vm.Script(inlineScripts.join(String.fromCharCode(10)), { filename: 'combined inline app scripts' });
          if (html.split('function selectHistoryFilter(').length - 1 !== 1) throw new Error('History filter handler is duplicated or missing');
          for (const screen of ['wallet', 'history', 'exchange', 'p2p', 'profile']) {
            if (!html.includes('id="' + screen + '"') && !html.includes("id='" + screen + "'")) throw new Error('Missing screen: ' + screen);
          }
          if (!html.includes('apiDemo("history")')) throw new Error('History API is not wired');
          for (const feature of ['id="swapAmount"', 'oninput="calculateSwap()"', 'id="swapResult"', 'swapRates[c[2]]=q.usd', 'amount*fromRate/toRate', 'Курс недоступен']) {
            if (!html.includes(feature)) throw new Error('Swap quote check failed: ' + feature);
          }
          if (!html.includes('let swapFrom="USDT",swapTo="SOL"')) throw new Error('Default swap pair has no quoted market price');
          for (const code of ['TRC20', 'BEP20', 'TON', 'SOL', 'ERC20']) {
            if (!html.includes(code + ":'<svg")) throw new Error('Missing inline network logo: ' + code);
          }
          if (!html.includes('networkIconMarkup(n[0])')) throw new Error('Network list does not render SVG logos');
          if (!html.includes('renderNetworkIcon("depositNetworkIcon",network)') || !html.includes('renderNetworkIcon("withdrawNetworkIcon",network)')) throw new Error('Selected network icons are not updated');
          if (!html.includes('id="depositNetworkIcon"') || !html.includes('id="withdrawNetworkIcon"')) throw new Error('Selected network icon mount is missing');
          if (html.includes('<span class="network-icon">\'+n[0]+\'</span>')) throw new Error('Network list still renders text abbreviations instead of logos');
          if (html.includes('id="solana-net-gradient"')) throw new Error('Network SVG contains a duplicate-prone gradient id');
          if (!html.includes('function openPromo(target)')) throw new Error('Wallet promo navigation handler is missing');
          for (const [promo, screen] of Object.entries({festival: 'festival', p2p: 'p2p', qr: 'qrpay', swap: 'exchange'})) {
            if (!html.includes(promo + ':"' + screen + '"')) throw new Error('Wallet promo route is missing: ' + promo);
          }
          if (!html.includes('const amount=Number(demoBalances[c[2]]||0),rate=walletUsdRate(c),usd=rate===null?null:amount*rate')) throw new Error('Send/withdraw asset rows do not use demo balances and market values');
          if (!html.includes('money(usd)') || !html.includes("money(amount)+' '+c[2]")) throw new Error('Send/withdraw asset rows do not display calculated values');
          if (html.includes('demoBuyQty') || html.includes('submitDemoBuy')) throw new Error('Disabled P2P purchase UI is still present');
          if (!html.includes('aria-label="Crypto Pay" onclick="openAccountSection(')) throw new Error('Crypto Pay navigation is incorrect');
          if (!worker.includes('status:501')) throw new Error('P2P purchase endpoint is not safely disabled');
          if (!worker.includes('!currencies.includes(currency)')) throw new Error('Payment currency validation is not using the shared currency list');

          for (const address of ['TFGYaqcb1h46KofUBWKaGuEULjYHnzRMrP', '0xBB26e15c06918A2c81c0dB8076F7f4a60951cA07', 'UQAjlBA6Dwfh7u4A-bIm4luYh3VMWzTgfYDBk6PY8fnVzq2t', 'AzipMp95M69Fi74q8t1JYmSPrtna7Vxq84Ad2LNxXdbP', 'bc1qzsw0f2wjw7m758y2swvunvzmefjdyq942nnmzp', 'ltc1qpled3utccrjlqskn6lcpane2su4x2j52a8qrjv']) {
            if (!html.includes(address)) throw new Error('Missing demo address: ' + address);
          }
          for (const network of ['TRC20','BEP20','TON','SOL','ERC20','BTC','LTC']) {
            if (!html.includes(network + ':')) throw new Error('Missing network support: ' + network);
          }
          for (const asset of ['USDT','GRAM','SOL','TRX','BTC','ETH','LTC','BNB','USDC','XAUT']) {
            if (!html.includes(asset + ':[')) throw new Error('Missing asset network mapping: ' + asset);
          }
          if (!html.includes('id="walletAssetsToggle"') || !html.includes('aria-controls="walletAssets"') || !html.includes('function toggleWalletAssets()')) throw new Error('Wallet assets toggle is not wired accessibly');
          if (!html.includes('function decorativeQrMarkup()') || !html.includes('aria-label="QR-код адреса"')) throw new Error('Decorative QR markup is missing');

          const expectedCoins = ['USDT','GRAM','SOL','TRX','BTC','ETH','LTC','BNB','USDC','XAUT'];
          for (const coin of expectedCoins) if (!html.includes("'" + coin + "'") && !html.includes('"' + coin + '"')) throw new Error('Missing official wallet coin: ' + coin);
          if (/['"]DOGE['"]|['"]HAUT['"]/.test(html)) throw new Error('Delisted or unsupported asset remains in wallet UI');
          if (!html.includes('USDC:["ERC20","BEP20"]')) throw new Error('USDC network list differs from Crypto Bot support docs');
          if (worker.includes('"DOGE"') || worker.includes('"TON"')) throw new Error('Delisted or renamed currency remains in demo database catalog');
          if (!worker.includes('["Tether Gold","XAUT"]')) throw new Error('XAUT missing from worker wallet summary');
          const navTabs = ['wallet','market','exchange','p2p','profile'];
          for (const tab of navTabs) if (!html.includes('data-screen="' + tab + '"')) throw new Error('Bottom navigation is missing tab: ' + tab);
          for (const label of ['Кошелек','Биржа','Обмен','P2P','Аккаунт']) if (!html.includes('>' + label + '</button>')) throw new Error('Bottom navigation label is missing: ' + label);
          if (!html.includes('grid-template-columns:repeat(5,minmax(0,1fr))')) throw new Error('Bottom navigation must have five equal tabs');
          if (!html.includes('onclick="openScreen(\'p2p\')"') || !html.includes('onclick="openScreen(\'history\')"')) throw new Error('More menu is missing P2P or transaction history shortcuts');
          if (!html.includes('function walletUsdRate(coin){const raw=') || !html.includes('value===null?"$ —"')) throw new Error('Unknown market prices must not be presented as zero valuation');
          console.log('Passed: Worker syntax, inline JS syntax, mirrored HTML, swap, wallet network icons, promo routes, asset balances, history, P2P safety and currency validation.');
          NODE
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect(':memory:')
          db.executescript(open('schema.sql', encoding='utf-8').read())
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected = {'users', 'balances', 'demo_transactions', 'demo_payments'}
          assert expected <= tables, f'Missing tables: {expected - tables}'
          print('Passed: SQLite schema creates all expected tables.')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Pages artifact indexing
        run: sleep 8
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
